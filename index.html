<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Día">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Mi Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0c0c0c; --paper:#f7f7f7; --ink:#111; --gray:#6d6d6d; --mute:#b4b4b4; --dots:#e2e2e2;
  --red:#ff3b30;
  --c-eventos:#4b57d3; --c-cumple:#e4f36f; --c-listas:#f2633b;
  --i-eventos:#7c8bff; --i-cumple:#d9f05a; --i-listas:#ff7a4d;
  --pad:28px; --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--dark);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ======================= PORTADA ======================= */
#home{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;background:var(--dark);transition:transform .45s var(--ease),filter .45s}
#home.away{transform:scale(.94) translateX(-6%);filter:brightness(.6)}

/* --- estado plegado (oscuro) --- */
.dark{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 74px) var(--pad) 0;color:#fff;will-change:opacity,filter,transform;transform-origin:50% 0}
.brief{font-size:26px;line-height:1.31;font-weight:600;letter-spacing:-.55px;color:var(--gray)}
.brief b{color:#fff;font-weight:600}
.brief .ic{display:inline-grid;place-items:center;width:23px;height:23px;border:2px solid #fff;border-radius:6px;vertical-align:-2px;margin-right:6px;color:#fff}
.brief .ic svg{width:13px;height:13px}
.brief .av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;overflow:hidden;vertical-align:middle;position:relative;top:-3px;margin:0 6px 0 2px;background:#2a2a2a;color:#fff;font-size:14px;font-weight:600;letter-spacing:0}
.brief .av img{width:100%;height:100%;object-fit:cover;display:block}
.num{display:inline-block;white-space:nowrap}
.num>span{display:inline-block;animation:drop .75s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes drop{0%{transform:translateY(-.75em);opacity:0;filter:blur(4px)}60%{opacity:1}100%{transform:none;opacity:1;filter:none}}
.wordin{animation:wordin .7s var(--ease) both}
@keyframes wordin{from{opacity:0;filter:blur(10px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.pill{display:flex;align-items:center;gap:6px;height:35px;padding:0 12px 0 10px;border-radius:99px;font-size:13.5px;font-weight:600;letter-spacing:-.1px;color:#fff;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:background .25s,color .25s,transform .15s}
.pill svg{width:16px;height:16px;flex:none}
.pill .n{opacity:.5;font-weight:500;font-variant-numeric:tabular-nums}
.pill:active{transform:scale(.95)}
.pill.on{background:#fff;color:#111;border-color:#fff}
.pill.on .n{opacity:.45}

.tset{position:absolute;top:calc(var(--safe-t) + 18px);right:20px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#8d8d8d;background:#1a1a1a}
.tset svg{width:18px;height:18px}
.tset .sync{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#34c759;border:2px solid #1a1a1a}
.tset .sync span{display:none}.tset .sync i{display:none}
.tset .sync.err{background:var(--red)}.tset .sync.busy{background:#ffcc00}

#sparks{position:absolute;left:0;right:0;top:0;pointer-events:none}
#sparks i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:twinkle var(--d) ease-in-out var(--dl) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:var(--o);transform:scale(1)}}

/* --- capa clara + cabecera desplegada --- */
.lightbg{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
.xhead{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 22px) var(--pad) 0;display:flex;justify-content:space-between;align-items:flex-start;opacity:0;pointer-events:none;will-change:opacity,filter,transform}
.xnum{display:flex;align-items:flex-start;gap:9px;font-size:62px;line-height:.92;font-weight:700;letter-spacing:-2.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.xnum i{width:12px;height:12px;border-radius:50%;background:var(--red);margin-top:21px;flex:none}
.xnum.title{font-size:44px;letter-spacing:-1.6px;padding-top:6px}
.xnum.title i{margin-top:14px}
.xday{text-align:right;font-size:22px;line-height:1.15;font-weight:500;color:#9a9a9a;letter-spacing:-.4px;padding-top:4px}
.xday b{display:block;color:#7a7a7a;font-weight:500}

/* --- hoja de tareas --- */
.sheet{position:absolute;left:0;right:0;top:var(--topE);height:calc(100% - var(--topE));background:var(--paper);border-radius:34px 34px 0 0;
  will-change:transform;touch-action:none;display:flex;flex-direction:column;box-shadow:0 -1px 0 rgba(255,255,255,.04)}
.grab{flex:none;height:18px}
.list{flex:1;min-height:0;overflow:hidden;padding:0 var(--pad) 120px;touch-action:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#home.open .list{overflow-y:auto;touch-action:pan-y}
.addbar,.daypop{touch-action:manipulation;-webkit-user-select:text;user-select:text}
.list.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}

.row{display:flex;align-items:flex-start;gap:16px;padding:19px 0 18px;position:relative}
.row::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:1.5px dotted var(--dots)}
.row .ico{flex:none;width:22px;height:22px;margin-top:1px;display:grid;place-items:center;color:#d0d0d0}
.row .ico svg{width:21px;height:21px}
.ck{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;border:1.6px solid #d9d9d9;background:#fff;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .15s}
.ck::after{content:"";width:5px;height:10px;border:solid transparent;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck:active{transform:scale(.88)}
.row .t{flex:1;min-width:0;font-size:18px;line-height:1.3;font-weight:600;letter-spacing:-.35px;color:var(--ink);word-break:break-word}
.row .m{flex:none;font-size:15.5px;line-height:1.5;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.row .m.late{color:var(--red);opacity:.85}
.row .m.sel{color:var(--ink)}
.row.checking .ck{background:var(--ink);border-color:var(--ink)}
.row.checking .ck::after{border-color:#fff}
.row.checking .t{color:#bbb;text-decoration:line-through;text-decoration-thickness:1.5px}
.row.checking{animation:rowout .4s .2s var(--ease) forwards}
@keyframes rowout{to{opacity:0;transform:translateX(26px);filter:blur(3px)}}
.empty{padding:22px 0;font-size:17px;font-weight:500;color:var(--mute);letter-spacing:-.3px}

/* --- barra de añadir --- */
.addbar{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-b) + 16px);display:flex;align-items:center;gap:8px;height:58px;padding:0 7px 0 8px;border-radius:99px;
  background:#ebebeb;opacity:0;pointer-events:none;will-change:opacity,transform}
#home.open .addbar{pointer-events:auto}
.addbar input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:17px;font-weight:500;letter-spacing:-.3px;padding-left:8px}
.addbar input::placeholder{color:#a4a4a4}
.qday{flex:none;height:42px;padding:0 15px;border-radius:99px;background:#fff;font-size:15px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.qday svg{width:12px;height:12px;opacity:.5;transition:transform .25s}
.qday.openp svg{transform:rotate(180deg)}
.addbtn{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}
.addbtn svg{width:20px;height:20px}
.addbtn:active{transform:scale(.92)}
.daypop{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-b) + 84px);background:#fff;border-radius:24px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;transform-origin:30% 100%;animation:pop .28s var(--ease)}
.daypop::-webkit-scrollbar{display:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96);filter:blur(4px)}}
.daypop button{flex:none;min-width:58px;height:62px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#f3f3f3;padding:0 10px}
.daypop button small{font-size:11.5px;font-weight:600;color:#8a8a8a;text-transform:capitalize}
.daypop button b{font-size:19px;font-weight:600;letter-spacing:-.4px}
.daypop button.on{background:var(--ink);color:#fff}.daypop button.on small{color:#aaa}
.daypop .other{position:relative}
.daypop .other input{position:absolute;inset:0;opacity:0}

/* ======================= PÁGINAS (eventos / cumpleaños / ajustes) ======================= */
.page{position:fixed;inset:0;max-width:520px;margin:0 auto;z-index:20;display:flex;flex-direction:column;transform:translateX(104%);transition:transform .5s var(--ease);
  padding:calc(var(--safe-t) + 18px) 0 0;overflow:hidden}
.page.on{transform:none}
.page[data-p=eventos]{background:var(--c-eventos);color:#fff}
.page[data-p=cumple]{background:var(--c-cumple);color:#111}
.page[data-p=ajustes]{background:#f2f2f4;color:#111}
.ph{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,currentColor 40%,transparent)}
.back svg{width:18px;height:18px}
.ph .cnt{font-size:15px;font-weight:500;opacity:.65}
.ptitle{padding:22px 24px 0;font-size:46px;line-height:1;font-weight:400;letter-spacing:-2px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:0 24px 130px;-webkit-overflow-scrolling:touch}
.hero{margin:22px 0 8px;padding:20px 20px 22px;border-radius:28px;background:color-mix(in srgb,currentColor 9%,transparent)}
.hero small{display:block;font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;opacity:.6}
.hero b{display:block;margin-top:8px;font-size:30px;line-height:1.1;font-weight:500;letter-spacing:-1px;word-break:break-word}
.hero span{display:block;margin-top:8px;font-size:15px;font-weight:500;opacity:.75}
.glabel{margin:26px 0 4px;font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;opacity:.55}
.prow{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,currentColor 14%,transparent)}
.prow:last-child{border-bottom:0}
.prow .dt{flex:none;width:46px;text-align:center}
.prow .dt b{display:block;font-size:26px;line-height:1;font-weight:500;letter-spacing:-1px}
.prow .dt small{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;opacity:.6}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:16.5px;line-height:1.3;font-weight:600;letter-spacing:-.25px;word-break:break-word}
.prow .tx span{display:block;margin-top:2px;font-size:13px;opacity:.65}
.rchk{flex:none;width:30px;height:30px;border-radius:50%;border:1.6px solid color-mix(in srgb,currentColor 50%,transparent);display:grid;place-items:center;transition:.2s}
.rchk::after{content:"";width:6px;height:11px;border:solid transparent;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.prow.checking .rchk{background:currentColor;border-color:currentColor}
.page[data-p=eventos] .prow.checking .rchk::after{border-color:var(--c-eventos)}
.page[data-p=cumple] .prow.checking .rchk::after{border-color:var(--c-cumple)}
.prow.checking{animation:rowout .4s .2s var(--ease) forwards}
.pempty{margin-top:24px;font-size:16px;opacity:.7;line-height:1.45}
.pbar{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-b) + 16px);display:flex;align-items:center;gap:8px;height:58px;padding:0 7px 0 20px;border-radius:99px;
  border:1.5px solid color-mix(in srgb,currentColor 45%,transparent);background:inherit}
.page[data-p=eventos] .pbar{background:var(--c-eventos)}.page[data-p=cumple] .pbar{background:var(--c-cumple)}
.pbar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;font-weight:500}
.pbar input::placeholder{color:inherit;opacity:.6}
.pbar .addbtn{background:#111;color:#fff}
.page[data-p=eventos] .pbar .addbtn{background:#fff;color:var(--c-eventos)}

/* ajustes */
.set{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.scard{background:#fff;border-radius:24px;padding:20px}
.scard h3{font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:#8a8a8a;margin-bottom:12px}
.scard p.help{font-size:13.5px;color:#777;line-height:1.45;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:#888;margin-bottom:5px;font-weight:500}
.f input{width:100%;height:50px;padding:0 15px;border-radius:14px;border:1px solid #e6e6e6;background:#fafafa;outline:none;font-size:16px}
.f input:focus{border-color:#111;background:#fff}
.phrow{display:flex;align-items:center;gap:14px;margin-top:6px}
.phrow>div{flex:1}.phrow b{font-size:15px;display:block}.phrow p{font-size:12.5px;color:#888}
.phprev{width:58px;height:58px;border-radius:50%;background:#111;color:#fff;font-size:22px;font-weight:600;overflow:hidden;display:grid;place-items:center;flex:none}
.phprev img{width:100%;height:100%;object-fit:cover}
.btns{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;height:48px;border-radius:99px;background:#111;color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:#111;border:1.5px solid #d5d5d5}
.status{font-size:13px;margin-top:14px;display:flex;align-items:center;gap:8px;color:#666}
.status i{width:8px;height:8px;border-radius:50%;background:#bbb}
.status.ok i{background:#34c759}.status.err i{background:var(--red)}

/* ======================= HOJA DE FECHA (cumple / evento) ======================= */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.dsheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;color:#111;border-radius:30px 30px 0 0;padding:14px 20px calc(var(--safe-b) + 20px);
  transform:translateY(105%);visibility:hidden;transition:transform .4s var(--ease),visibility .4s;z-index:41}
.show .sheet-bg{opacity:1;pointer-events:auto}.show .dsheet{transform:none;visibility:visible}
.dgrab{width:40px;height:5px;border-radius:9px;background:#e1e1e1;margin:0 auto 16px}
.dsheet h4{font-size:24px;font-weight:600;letter-spacing:-.6px;margin-bottom:16px}
.two{display:flex;gap:10px}.two .f{flex:1}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 16px;color:#444}
.chk input{width:20px;height:20px;accent-color:#111}
.save{width:100%;height:54px;border-radius:99px;background:#111;color:#fff;font-weight:600;font-size:16px}

/* toast */
.toast{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translate(-50%,-90px);background:#111;color:#fff;padding:11px 18px;border-radius:99px;font-size:14.5px;font-weight:500;
  transition:transform .35s var(--ease);z-index:60;display:flex;align-items:center;gap:12px;white-space:nowrap;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:translate(-50%,0)}
#home:not(.open)~.toast{background:#fff;color:#111}#home:not(.open)~.toast button{color:#c2410c}
.page.on~.toast{background:#111;color:#fff}
.toast button{font-weight:600;color:#ffd60a}

@media (max-height:700px){
  .dark{padding-top:calc(var(--safe-t) + 62px)}
  .brief{font-size:22px}.pills{margin-top:18px}
  .row{padding:14px 0 13px}.row .t{font-size:16.5px}
  .xnum{font-size:52px}.xnum i{margin-top:16px}
}
@media (max-width:370px){.brief{font-size:23px}.pill{padding:0 11px 0 9px;font-size:13px}}
</style>
</head>
<body>

<main id="home">
  <div id="sparks"></div>
  <div class="dark" id="dark">
    <p class="brief" id="brief"></p>
    <div class="pills" id="pills">
      <button class="pill" data-pill="eventos"><svg viewBox="0 0 24 24" fill="none" stroke="var(--i-eventos)" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Eventos <span class="n" id="nEv"></span></button>
      <button class="pill" data-pill="listas"><svg viewBox="0 0 24 24" fill="none" stroke="var(--i-listas)" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="var(--i-listas)"/><circle cx="4.5" cy="12" r="1.3" fill="var(--i-listas)"/><circle cx="4.5" cy="18" r="1.3" fill="var(--i-listas)"/></svg>Listas <span class="n" id="nLi"></span></button>
      <button class="pill" data-pill="cumple"><svg viewBox="0 0 24 24" fill="none" stroke="var(--i-cumple)" stroke-width="2.2"><path d="M4 21V12h16v9M2 21h20M7 12V9h10v3M12 9V6"/><path d="M12 2.5c.8.8.8 2 0 2.6-.8-.6-.8-1.8 0-2.6z" fill="var(--i-cumple)"/></svg>Cumpleaños <span class="n" id="nBd"></span></button>
    </div>
  </div>
  <button class="tset" data-page="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="sync" id="syncInd" hidden><i></i><span></span></span></button>

  <div class="lightbg" id="lightbg"></div>
  <header class="xhead" id="xhead">
    <div class="xnum" id="xnum"></div>
    <div class="xday" id="xday"></div>
  </header>

  <section class="sheet" id="sheet">
    <div class="grab" id="grab"></div>
    <div class="list" id="list"></div>
    <div class="daypop" id="daypop" hidden></div>
    <form class="addbar" id="addbar" autocomplete="off">
      <button type="button" class="qday" id="qday"><span id="qdayTxt">Hoy</span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 7.5 3-3 3 3"/></svg></button>
      <input id="qtext" enterkeyhint="send" placeholder="Añadir una tarea…" aria-label="Añadir">
      <button type="button" class="addbtn" id="qadd" aria-label="Añadir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
  </section>
</main>

<!-- EVENTOS / CUMPLEAÑOS -->
<section class="page" data-p="eventos" id="pEventos">
  <div class="ph"><button class="back" data-back aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="cnt" data-cnt></span></div>
  <h1 class="ptitle">Eventos</h1>
  <div class="pbody" data-body></div>
  <form class="pbar" data-kind="evento"><input data-q placeholder="Nuevo evento…" enterkeyhint="next"><button type="button" class="addbtn" data-padd aria-label="Añadir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></form>
</section>
<section class="page" data-p="cumple" id="pCumple">

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const KEY="midia-v1";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const uid=()=>Math.random().toString(36).slice(2,10);
let today=new Date();today.setHours(0,0,0,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=d=>d.length===5?d:d.slice(5);
const GSRC=["calendario","contactos","principal","google"];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const daysFrom=k=>Math.round((parse(k)-today)/864e5);

/* ---------------- datos ---------------- */
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db)db={name:"",tasks:[],bdays:[],events:[],lists:[]};
db.cfg=db.cfg||{url:"",key:""};
db.tasks=(db.tasks||[]).filter(x=>!x.done);
db.lists=(db.lists||[]).filter(x=>!x.done);
db.bdays=db.bdays||[];db.events=db.events||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const linked=()=>!!(db.cfg.url&&db.cfg.key);

/* ---------------- Google (Apps Script) ---------------- */
async function apiGet(action="sync"){
  const u=new URL(db.cfg.url);u.searchParams.set("key",db.cfg.key);u.searchParams.set("action",action);
  const r=await fetch(u,{redirect:"follow"});const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Error");return j;
}
async function apiPost(body){
  const r=await fetch(db.cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({key:db.cfg.key,...body}),redirect:"follow"});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Error");return j;
}
async function pushPending(){
  for(const b of db.bdays.filter(x=>x.pend)){try{const j=await apiPost({action:"addBday",t:b.t,d:b.d,id:b.id});b.gid=j.gid;delete b.pend}catch(e){}}
  for(const e of db.events.filter(x=>x.pend)){try{const j=await apiPost({action:"addEvent",t:e.t,d:e.d,h:e.h,id:e.id});e.gid=j.gid;delete e.pend}catch(err){}}
}
function merge(list,remote,keyFn){
  const local=list.filter(x=>!GSRC.includes(x.src));
  const byId=new Map(local.map(x=>[x.id,x])),byGid=new Map(local.filter(x=>x.gid).map(x=>[x.gid,x])),byKey=new Map(local.map(x=>[keyFn(x),x]));
  const extra=[];
  for(const r of remote){
    const mine=(r.app&&byId.get(r.app))||byGid.get(r.gid)||byKey.get(keyFn(r));
    if(mine){if(!mine.gid)mine.gid=r.gid;if(mine.d.length===5&&r.d.length>5)mine.d=r.d;continue}
    extra.push({id:"g-"+r.gid,t:r.t,d:r.d,h:r.h||"",gid:r.gid,src:r.src||"google"});
  }
  return local.concat(extra);
}
let syncing=false,lastTry=0;
async function sync(force){
  if(!linked()||syncing)return;
  if(!force&&Date.now()-lastTry<60000)return;
  syncing=true;lastTry=Date.now();setSync("busy","Sincronizando…");
  try{
    await pushPending();
    const j=await apiGet("sync");
    db.bdays=merge(db.bdays,j.bdays,x=>x.t.trim().toLowerCase()+"|"+md(x.d));
    db.events=merge(db.events,j.events.map(e=>({...e,src:"google"})),x=>x.t.trim().toLowerCase()+"|"+x.d+"|"+(x.h||""));
    db.lastSync=Date.now();render();setSync("ok");
  }catch(e){setSync("err","Sin conexión con Google");console.warn(e)}
  syncing=false;
}
function setSync(state,msg){
  const el=$("#syncInd");if(!linked()){el.hidden=true;return}
  el.hidden=false;el.className="sync "+(state==="ok"?"":state);
  if(state==="ok"&&db.lastSync){const d=new Date(db.lastSync);msg=`${pad(d.getHours())}:${pad(d.getMinutes())}`}
  const st=$("#sStatus");st.className="status "+(state==="ok"?"ok":state==="err"?"err":"");
  st.querySelector("span").textContent=state==="ok"?"Conectado · última sincronización "+(msg||""):msg;
}
function gcalUrl({t,d,h,yearly}){
  let dates;
  if(h){const [H,M]=h.split(":").map(Number);const s=parse(d);s.setHours(H,M);const e=new Date(s.getTime()+36e5);
    const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;dates=`${f(s)}/${f(e)}`;}
  else{const e=parse(d);e.setDate(e.getDate()+1);dates=`${d.replace(/-/g,"")}/${iso(e).replace(/-/g,"")}`}
  const p=new URLSearchParams({action:"TEMPLATE",text:t,dates,ctz:"Europe/Madrid"});
  if(yearly)p.set("recur","RRULE:FREQ=YEARLY");
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
const openGcal=o=>window.open(gcalUrl(o),"_blank");
async function toGoogle(kind,item){
  if(!linked()){
    if(kind==="bday")openGcal({t:"🎂 Cumpleaños de "+item.t,d:iso(nextBday(item.d).date),yearly:true});else openGcal(item);
    return;
  }
  try{const j=await apiPost({action:kind==="bday"?"addBday":"addEvent",t:item.t,d:item.d,h:item.h||"",id:item.id});item.gid=j.gid;delete item.pend;toast("Guardado en Google ✓")}
  catch(e){item.pend=true;toast("Guardado. Se subirá a Google al reconectar")}
  render();
}

/* ---------------- fechas ---------------- */
function nextBday(s){
  const [mm,dd]=md(s).split("-").map(Number);
  let n=new Date(today.getFullYear(),mm-1,dd);if(n<today)n.setFullYear(n.getFullYear()+1);
  const y=s.length>5?Number(s.slice(0,4)):null;
  return {date:n,days:Math.round((n-today)/864e5),age:y?n.getFullYear()-y:null};
}
const inDays=n=>n===0?"Hoy":n===1?"Mañana":`En ${n} días`;
const fd=d=>`${d.getDate()} ${MESES[d.getMonth()]}`;
function dayChip(k){const n=daysFrom(k),d=parse(k);return n===0?"Hoy":n===1?"Mañana":n<7?`${DIAS[d.getDay()].slice(0,3)} ${d.getDate()}`:fd(d)}

/* ---------------- iconos ---------------- */
const IC={
  task:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18"/></svg>',
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 21V12h16v9M7 12V9h10v3M12 9V5"/></svg>',
  evRow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="15" rx="4"/><path d="M8 3v4M16 3v4M8 11h8M8 15h5"/></svg>',
  cakeRow:'<svg viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="1.9"><path d="M4 21V12h16v9M2 21h20M7 12V9h10v3M12 9V6"/><path d="M12 2.5c.8.8.8 2 0 2.6-.8-.6-.8-1.8 0-2.6z" fill="#f5a623"/></svg>',
};

/* ---------------- frase de arriba ---------------- */
const N=n=>`<span class="num">${n}</span>`;
const plural=(n,a,b)=>`${N(n)} ${n===1?a:b}`;
function briefText(){
  const t=iso(today),now=new Date(),hr=now.getHours(),nowM=hr*60+now.getMinutes();
  const sal=hr<13?"Buenos días":hr<20?"Buenas tardes":"Buenas noches";
  const face=db.photo?`<img src="${db.photo}" alt="">`:esc((db.name||"?")[0].toUpperCase());
  const who=`, <button class="av" data-photo aria-label="Cambiar foto">${face}</button>${db.name?`<b>${esc(db.name)}</b>`:""}`;
  const tom=hr>=16;  // de 00:00 a 15:59 resume HOY; de 16:00 a 23:59 resume MAÑANA
  const m=new Date(today);if(tom)m.setDate(m.getDate()+1);const k=iso(m);
  const tasks=db.tasks.filter(x=>x.d===k),evs=db.events.filter(e=>e.d===k),bds=db.bdays.filter(b=>nextBday(b.d).days===(tom?1:0));
  const late=db.tasks.filter(x=>x.d<t);
  const parts=[];
  if(tasks.length)parts.push(`<b><span class="ic">${IC.task}</span>${plural(tasks.length,"tarea","tareas")}</b>`);
  if(evs.length)parts.push(`<b><span class="ic">${IC.cal}</span>${plural(evs.length,"evento","eventos")}</b>`);
  if(bds.length)parts.push(`<b><span class="ic">${IC.cake}</span>${plural(bds.length,"cumpleaños","cumpleaños")}</b>`);
  let s=`${sal}${who}.<br>`;
  if(parts.length){const list=parts.length>1?parts.slice(0,-1).join(", ")+" y "+parts[parts.length-1]:parts[0];s+=tom?`Mañana tienes ${list}.`:`Tienes ${list} hoy.`}
  else s+=`No tienes nada pendiente ${tom?"mañana":"hoy"}.`;
  const mins=evs.filter(e=>e.h).map(e=>{const[H,M]=e.h.split(":").map(Number);return H*60+M});
  const hm=x=>N(`${pad(Math.floor(x/60)%24)}:${pad(x%60)}`);
  if(tom){if(mins.length)s+=` Lo primero, a las <b>${hm(Math.min(...mins))}</b>.`;else if(!parts.length)s+=` Día <b>libre</b> por delante.`}
  else{
    if(mins.length){const end=Math.max(...mins)+60;s+=end>nowM?` Estás <b>libre</b> a partir de las <b>${hm(end)}</b>.`:` Ya estás <b>libre</b> el resto del día.`}
    else if(!tasks.length)s+=` Día <b>libre</b> por delante.`;
  }
  if(late.length)s+=` Te ${late.length===1?"queda":"quedan"} <b>${plural(late.length,"atrasada","atrasadas")}</b>.`;
  return s;
}
function rollNums(root){
  let k=0;
  root.querySelectorAll(".num").forEach(el=>{el.innerHTML=[...el.textContent].map(c=>`<span style="animation-delay:${120+k++*55}ms">${c===" "?"&nbsp;":esc(c)}</span>`).join("")});
}
let lastBrief="";
function renderBrief(force){
  const h=briefText();if(h===lastBrief&&!force)return;lastBrief=h;
  const el=$("#brief");el.innerHTML=h;rollNums(el);
  if(force){el.classList.remove("wordin");void el.offsetWidth;el.classList.add("wordin")}
}

/* ---------------- estado de la portada ---------------- */
let mode="tareas", selDay=iso(today);

function renderPills(){
  const t=iso(today);
  const ev=db.events.filter(e=>e.d>=t&&daysFrom(e.d)<=7).length;
  const bd=db.bdays.filter(b=>nextBday(b.d).days<=30).length;
  $("#nEv").textContent=ev||"";$("#nLi").textContent=db.lists.length||"";$("#nBd").textContent=bd||"";
  $$("[data-pill]").forEach(p=>p.classList.toggle("on",p.dataset.pill===mode));
}
let lastX="";
function renderXhead(){
  let L,R;
  if(mode==="listas"){L=`Listas<i></i>`;R="";}
  else{const d=parse(selDay);L=`${N(pad(d.getDate()))}<i></i>`;R=`<b>${DIAS[d.getDay()]}</b>`}
  const key=mode+selDay;
  $("#xnum").classList.toggle("title",mode==="listas");
  if(key!==lastX){lastX=key;$("#xnum").innerHTML=L;rollNums($("#xnum"))}
  $("#xday").innerHTML=R;
  $("#qday").hidden=mode==="listas";
  $("#qdayTxt").textContent=dayChip(selDay);
  $("#qtext").placeholder=mode==="listas"?"Añadir a la lista…":selDay===iso(today)?"Añadir una tarea…":`Añadir para ${dayChip(selDay).toLowerCase()}…`;
}
const row=(kind,id,title,meta="",metaCls="")=>`<div class="row"><button class="ck" data-done="${kind}:${id}" aria-label="Completar"></button><div class="t">${esc(title)}</div>${meta?`<div class="m ${metaCls}">${meta}</div>`:""}</div>`;
const irow=(icon,title,meta="")=>`<div class="row"><span class="ico">${icon}</span><div class="t">${esc(title)}</div>${meta?`<div class="m">${meta}</div>`:""}</div>`;
function renderList(){
  let h="";
  if(mode==="listas"){
    h=db.lists.map(x=>row("l",x.id,x.t)).join("")||`<p class="empty">Cosas sin fecha: la compra, ideas, pendientes…</p>`;
  }else{
    // todas las tareas a la vez: atrasadas, lo de hoy y lo de los próximos días (con su día a la derecha)
    const t=iso(today);
    h+=db.tasks.filter(x=>x.d<t).sort((a,b)=>a.d.localeCompare(b.d)).map(x=>row("t",x.id,x.t,daysFrom(x.d)===-1?"Ayer":fd(parse(x.d)),"late")).join("");
    h+=db.bdays.filter(b=>nextBday(b.d).days===0).map(b=>{const n=nextBday(b.d);return irow(IC.cakeRow,`Cumple de ${b.t}`,n.age?n.age+" años":"")}).join("");
    h+=db.events.filter(e=>e.d===t).sort((a,b)=>(a.h||"99").localeCompare(b.h||"99")).map(e=>irow(IC.evRow,e.t,e.h||"")).join("");
    h+=db.tasks.filter(x=>x.d===t).map(x=>row("t",x.id,x.t)).join("");
    h+=db.tasks.filter(x=>x.d>t).sort((a,b)=>a.d.localeCompare(b.d)).map(x=>row("t",x.id,x.t,dayChip(x.d),x.d===selDay?"sel":"")).join("");
    if(!h)h=`<p class="empty">Nada pendiente 🙌</p>`;
  }
  $("#list").innerHTML=h;
}
function renderHome(){renderBrief();renderPills();renderXhead();renderList()}
function render(){save();try{renderHome()}catch(e){console.error(e)}if(curPage==="eventos"||curPage==="cumple")renderPage(curPage)}

function setMode(m){
  if(m===mode)return;mode=m;
  const l=$("#list");l.classList.remove("swap");void l.offsetWidth;l.classList.add("swap");l.scrollTop=0;
  closeDayPop();renderHome();layout();
}
function setDay(k){
  selDay=k<iso(today)?iso(today):k;
  renderXhead();renderList();
}

/* ---------------- hoja arrastrable (plegada ⇄ desplegada) ---------------- */
const home=$("#home"),sheet=$("#sheet"),list=$("#list"),dark=$("#dark"),lightbg=$("#lightbg"),xhead=$("#xhead"),addbar=$("#addbar");
let ty=0,maxTy=1,expanded=false,tween=null,themeDark=null;
function layout(){
  const H=home.clientHeight;
  const topE=$("#xnum").offsetTop+$("#xnum").offsetHeight+18;     // la hoja desplegada empieza bajo el número
  home.style.setProperty("--topE",topE+"px");
  const pills=$("#pills"),collapsedTop=Math.max(dark.offsetTop+pills.offsetTop+pills.offsetHeight+40,H*.42);
  maxTy=Math.max(80,collapsedTop-topE);
  $("#sparks").style.height=collapsedTop+"px";
  apply(expanded?0:maxTy);
}
function apply(y){
  ty=y;sheet.style.transform=`translate3d(0,${y}px,0)`;
  const p=clamp(1-y/maxTy);
  dark.style.opacity=clamp(1-p*1.3);dark.style.filter=p>.02?`blur(${p*7}px)`:"";dark.style.transform=`translateY(${-p*26}px) scale(${1-p*.03})`;
  $("#sparks").style.opacity=1-p;$(".tset").style.opacity=clamp(1-p*2);$(".tset").style.pointerEvents=p>.5?"none":"";
  lightbg.style.opacity=p;
  const q=clamp((p-.42)/.58);
  xhead.style.opacity=q;xhead.style.filter=q<.99?`blur(${(1-q)*8}px)`:"";xhead.style.transform=`translateY(${(1-q)*16}px)`;
  const a=clamp((p-.6)/.4);addbar.style.opacity=a;addbar.style.transform=`translateY(${(1-a)*24}px)`;
  const dk=p<.5;if(dk!==themeDark){themeDark=dk;$('meta[name="theme-color"]').content=dk?"#0c0c0c":"#f7f7f7"}
}
function animateTo(target,dur=520){
  cancelAnimationFrame(tween);const from=ty,t0=performance.now();
  const ease=x=>1-Math.pow(1-x,3.2);
  const step=now=>{const k=clamp((now-t0)/dur);apply(from+(target-from)*ease(k));if(k<1)tween=requestAnimationFrame(step);else settle(target===0)};
  tween=requestAnimationFrame(step);
}
function settle(isOpen){
  const was=expanded;expanded=isOpen;home.classList.toggle("open",isOpen);
  if(!isOpen){list.scrollTop=0;closeDayPop();$("#qtext").blur();if(was)renderBrief(true)}
}
const expand=()=>animateTo(0),collapse=()=>animateTo(maxTy);

let drag=null,suppress=false;
/* Gesto: se decide en el PRIMER movimiento si arrastramos la hoja o dejamos que la lista haga scroll,
   para que el móvil no empiece su propio desplazamiento y "se quede" con el gesto. */
function dStart(y,target){
  if(curPage||target.closest("input,.daypop,.addbar,.dsheet,.tset"))return;
  cancelAnimationFrame(tween);
  drag={y0:y,ty0:ty,last:y,lt:performance.now(),v:0,state:"pending",fromList:!!target.closest("#list")};
}
function dMove(y,e){
  if(!drag)return;
  const dy=y-drag.y0;
  if(drag.state==="pending"){
    if(dy===0)return;
    if(expanded&&drag.fromList&&(dy<0||list.scrollTop>1)){drag=null;return}  // la lista hace scroll normal
    drag.state="drag";
  }
  if(e.cancelable)e.preventDefault();
  let n=drag.ty0+dy;
  if(n<0)n=-Math.pow(-n,.7);if(n>maxTy)n=maxTy+Math.pow(n-maxTy,.7);
  const now=performance.now(),dt=now-drag.lt;
  if(dt>0){drag.v=.7*((y-drag.last)/dt)+.3*drag.v;drag.last=y;drag.lt=now}
  if(Math.abs(dy)>6)drag.moved=true;
  apply(n);
}
function dEnd(){
  if(!drag)return;const d=drag;drag=null;
  if(d.state!=="drag")return;
  if(!d.moved){animateTo(expanded?0:maxTy,250);return}
  suppress=true;setTimeout(()=>suppress=false,80);
  const open=d.v<-.25?true:d.v>.25?false:ty<maxTy/2;
  animateTo(open?0:maxTy,open?460:540);
}
home.addEventListener("touchstart",e=>{if(e.touches.length===1)dStart(e.touches[0].clientY,e.target);else drag=null},{passive:true});
home.addEventListener("touchmove",e=>dMove(e.touches[0].clientY,e),{passive:false});
home.addEventListener("touchend",dEnd);home.addEventListener("touchcancel",dEnd);
home.addEventListener("mousedown",e=>{
  if(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents)return;   // ratón simulado tras un toque
  dStart(e.clientY,e.target);
  const mm=ev=>dMove(ev.clientY,ev),mu=()=>{dEnd();removeEventListener("mousemove",mm);removeEventListener("mouseup",mu)};
  addEventListener("mousemove",mm);addEventListener("mouseup",mu);
});
home.addEventListener("wheel",e=>{
  if(curPage)return;
  if(!expanded&&e.deltaY>12)expand();
  else if(expanded&&e.deltaY<-12&&list.scrollTop<=0)collapse();
},{passive:true});
$("#grab").addEventListener("click",()=>expanded?collapse():expand());
document.addEventListener("click",e=>{if(suppress){e.stopPropagation();e.preventDefault()}},true);

/* ---------------- selector de días ---------------- */
function openDayPop(){
  const pop=$("#daypop");let h="";
  for(let n=0;n<7;n++){const d=new Date(today);d.setDate(d.getDate()+n);const k=iso(d);
    h+=`<button type="button" data-pick="${k}" class="${k===selDay?"on":""}"><small>${n===0?"Hoy":n===1?"Mañana":DIAS[d.getDay()].slice(0,3)}</small><b>${d.getDate()}</b></button>`}
  h+=`<button type="button" class="other ${daysFrom(selDay)>6?"on":""}"><small>Otra</small><b>···</b><input type="date" id="otherDate" min="${iso(today)}" aria-label="Otra fecha"></button>`;
  pop.innerHTML=h;pop.hidden=false;$("#qday").classList.add("openp");
  $("#otherDate").onchange=e=>{if(e.target.value){setDay(e.target.value);closeDayPop()}};
}
function closeDayPop(){$("#daypop").hidden=true;$("#qday").classList.remove("openp")}
$("#qday").onclick=()=>$("#daypop").hidden?openDayPop():closeDayPop();
$("#daypop").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b){setDay(b.dataset.pick);closeDayPop()}});

/* ---------------- añadir ---------------- */
function quickAdd(){
  const inp=$("#qtext"),v=inp.value.trim();if(!v){inp.focus();return}
  inp.value="";
  if(mode==="listas"){db.lists.push({id:uid(),t:v});render();return}
  db.tasks.push({id:uid(),t:v,d:selDay});render();
  if(selDay!==iso(today))toast("Añadida a "+dayChip(selDay).toLowerCase()+" ✓");
}
$("#addbar").addEventListener("submit",e=>{e.preventDefault();quickAdd()});
$("#qadd").addEventListener("click",e=>{e.preventDefault();quickAdd()});
$("#qtext").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();quickAdd()}});
$("#qtext").addEventListener("focus",closeDayPop);

/* ---------------- completar = quitar (con deshacer) ---------------- */
const LISTNAME={t:"tasks",l:"lists",b:"bdays",e:"events"};
const DONEMSG={t:"Tarea hecha",l:"Tachado",b:"Cumpleaños quitado",e:"Evento quitado"};
let lastDone=null;
function completeItem(ref,rowEl){
  const [kind,id]=ref.split(":"),name=LISTNAME[kind],i=db[name].findIndex(x=>x.id===id);if(i<0)return;
  const it=db[name][i];
  if(it.src==="contactos"){toast("Viene de tus Contactos: bórralo allí");return}
  if(lastDone)finalizeDone();
  if(rowEl)rowEl.classList.add("checking");
  setTimeout(()=>{
    db[name]=db[name].filter(x=>x.id!==id);
    lastDone={name,it,i,timer:setTimeout(finalizeDone,4600)};
    render();toast(DONEMSG[kind],true);
  },rowEl?600:0);
}
function finalizeDone(){if(!lastDone)return;const {it,timer}=lastDone;clearTimeout(timer);lastDone=null;if(it.gid&&linked())apiPost({action:"delete",gid:it.gid}).catch(()=>{})}
function undoLast(){if(!lastDone)return;const {name,it,i,timer}=lastDone;clearTimeout(timer);lastDone=null;db[name].splice(Math.min(i,db[name].length),0,it);render();toast("Recuperado")}
function toast(m,undo){const t=$("#toast");t.innerHTML=`<span>${esc(m)}</span>`+(undo?'<button data-undo>Deshacer</button>':"");t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),undo?4500:2200)}

/* ---------------- páginas ---------------- */
let curPage=null;
const PAGE={eventos:"#pEventos",cumple:"#pCumple",ajustes:"#pAjustes"};
function openPage(p){
  if(curPage)closePage(true);
  curPage=p;if(p!=="ajustes")renderPage(p);else fillSettings();
  $(PAGE[p]).classList.add("on");home.classList.add("away");
  $('meta[name="theme-color"]').content=p==="eventos"?"#4b57d3":p==="cumple"?"#e4f36f":"#f2f2f4";themeDark=null;
  try{history.pushState({p},"")}catch(e){}
}
function closePage(silent){
  if(!curPage)return;$(PAGE[curPage]).classList.remove("on");home.classList.remove("away");curPage=null;
  $$(".pbar [data-q]").forEach(i=>i.blur());apply(ty);
  if(!silent)renderBrief(true);
}
addEventListener("popstate",()=>{if(curPage)closePage()});
document.addEventListener("click",e=>{if(e.target.closest("[data-back]")){if(history.state&&history.state.p)history.back();else closePage()}});

const prow=(kind,id,d,title,sub,canDel=true)=>`<div class="prow"><div class="dt"><b>${d.getDate()}</b><small>${MESES[d.getMonth()]}</small></div><div class="tx"><b>${esc(title)}</b><span>${sub}</span></div>${canDel?`<button class="rchk" data-done="${kind}:${id}" aria-label="Quitar"></button>`:""}</div>`;
function renderPage(p){
  const el=$(PAGE[p]),body=el.querySelector("[data-body]"),t=iso(today);let h="";
  if(p==="eventos"){
    const evs=db.events.filter(e=>e.d>=t).sort((a,b)=>(a.d+(a.h||"")).localeCompare(b.d+(b.h||"")));
    el.querySelector("[data-cnt]").textContent=evs.length?`${evs.length} próximos`:"";
    if(evs.length){
      const n=evs[0],d=parse(n.d),k=daysFrom(n.d);
      h+=`<div class="hero"><small>Lo próximo</small><b>${esc(n.t)}</b><span>${k<=1?inDays(k):`${DIAS[d.getDay()]} ${fd(d)}`}${n.h?" · "+n.h:" · todo el día"}${k>1?" · "+inDays(k).toLowerCase():""}</span></div>`;
      const wk=evs.filter(e=>daysFrom(e.d)<=6),lt=evs.filter(e=>daysFrom(e.d)>6);
      const r=e=>{const d=parse(e.d),k=daysFrom(e.d);return prow("e",e.id,d,e.t,[k<=1?inDays(k):DIAS[d.getDay()],e.h||"Todo el día",k>1&&k<=6?inDays(k).toLowerCase():""].filter(Boolean).join(" · "),e.src!=="contactos")};
      if(wk.length)h+=`<p class="glabel">Esta semana</p>`+wk.map(r).join("");
      if(lt.length)h+=`<p class="glabel">Más adelante</p>`+lt.map(r).join("");
    }else h=`<p class="pempty">No tienes eventos a la vista.<br>Escribe uno abajo y elige su fecha.</p>`;
  }
  if(p==="cumple"){
    const bds=db.bdays.map(b=>({...b,...nextBday(b.d)})).sort((a,b)=>a.days-b.days);
    el.querySelector("[data-cnt]").textContent=bds.length?`${bds.length} en total`:"";
    if(bds.length){
      const n=bds[0];
      h+=`<div class="hero"><small>${n.days===0?"¡Hoy! 🎂":"El próximo"}</small><b>${esc(n.t)}</b><span>${[n.age?`Cumple ${n.age}`:"",fd(n.date),n.days?inDays(n.days).toLowerCase():""].filter(Boolean).join(" · ")}</span></div>`;
      let curM=-1;
      for(const b of bds){
        const m=b.date.getMonth()+b.date.getFullYear()*12;
        if(m!==curM){curM=m;h+=`<p class="glabel">${MESESL[b.date.getMonth()]}</p>`}
        h+=prow("b",b.id,b.date,b.t,[b.age?`Cumple ${b.age}`:"",b.days<=6?inDays(b.days):DIAS[b.date.getDay()]].filter(Boolean).join(" · "),b.src!=="contactos");
      }
    }else h=`<p class="pempty">Aún no hay cumpleaños.<br>Escribe un nombre abajo y elige la fecha.</p>`;
  }
  body.innerHTML=h;
}
function pageAdd(form){
  const inp=form.querySelector("[data-q]");openDateSheet(form.dataset.kind==="cumple"?"cumple":"evento",inp.value.trim());inp.value="";inp.blur();
}
$$(".pbar").forEach(f=>{
  f.addEventListener("submit",e=>{e.preventDefault();pageAdd(f)});
  f.querySelector("[data-padd]").addEventListener("click",e=>{e.preventDefault();pageAdd(f)});
});

/* ---------------- hoja de fecha (evento / cumpleaños) ---------------- */
let type="evento";
function openDateSheet(t,title){
  type=t;$("#form").reset();
  $("#fHead").textContent=t==="cumple"?"Nuevo cumpleaños":"Nuevo evento";
  $("#lblTitle").textContent=t==="cumple"?"De quién es":"Qué evento es";
  $("#lblDate").textContent=t==="cumple"?"Fecha de nacimiento":"Fecha";
  $("#fTimeBox").style.display=t==="evento"?"":"none";
  $("#gcLbl").textContent=linked()?"Guardar también en Google Calendar":"Añadir también a Google Calendar (se abrirá)";
  $("#fTitle").value=title||"";$("#fDate").value=t==="cumple"?"":iso(today);$("#fGc").checked=true;
  $("#sheetWrap").classList.add("show");if(!title)setTimeout(()=>$("#fTitle").focus(),350);
}
const closeSheet=()=>$("#sheetWrap").classList.remove("show");
$("#sheetBg").onclick=closeSheet;
function saveSheet(){
  const t=$("#fTitle").value.trim(),d=$("#fDate").value,h=$("#fTime").value;
  if(!t){$("#fTitle").focus();toast("Escribe un nombre");return}
  if(!d){toast("Elige una fecha");try{$("#fDate").showPicker()}catch(e){$("#fDate").focus()}return}
  const gc=$("#fGc").checked;
  if(type==="cumple"){const it={id:uid(),t,d};db.bdays.push(it);if(gc)toGoogle("bday",it)}
  else{const it={id:uid(),t,d,h};db.events.push(it);if(gc)toGoogle("event",it)}
  closeSheet();render();if(!gc||!linked())toast("Guardado ✓");
}
$("#form").addEventListener("submit",e=>{e.preventDefault();saveSheet()});
$("#saveBtn").addEventListener("click",e=>{e.preventDefault();saveSheet()});

/* ---------------- clics generales ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const ds=b.dataset;
  if(ds.done)completeItem(ds.done,b.closest(".row,.prow"));
  if("undo" in ds)undoLast();
  if(ds.page)openPage(ds.page);
  if(ds.pill){if(ds.pill==="listas")setMode(mode==="listas"?"tareas":"listas");else openPage(ds.pill)}
});

/* ---------------- ajustes ---------------- */
function fillSettings(){paintPhoto();$("#sName").value=db.name||"";$("#sUrl").value=db.cfg.url;$("#sKey").value=db.cfg.key}
$("#sName").onchange=e=>{db.name=e.target.value.trim();render();lastBrief=""};
document.addEventListener("click",e=>{if(e.target.closest("[data-photo]"))$("#photoIn").click()});
$("#photoIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const c=document.createElement("canvas"),S=200;c.width=c.height=S;const m=Math.min(img.width,img.height);
    c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    db.photo=c.toDataURL("image/jpeg",.85);URL.revokeObjectURL(img.src);render();paintPhoto();toast("Foto actualizada ✓");
  };img.src=URL.createObjectURL(f);e.target.value="";
};
function paintPhoto(){$("#sPhoto").innerHTML=db.photo?`<img src="${db.photo}" alt="">`:esc((db.name||"?")[0].toUpperCase())}
$("#sSave").onclick=async()=>{
  db.cfg={url:$("#sUrl").value.trim(),key:$("#sKey").value.trim()};save();
  if(!linked()){setSync("","Sin conectar");$("#syncInd").hidden=true;toast("Conexión quitada");return}
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(db.cfg.url)){setSync("err","La URL debe terminar en /exec");return}
  setSync("busy","Probando…");
  try{await apiGet("ping");toast("¡Conectado con Google! ✓");await sync(true)}catch(e){setSync("err","No conecta: "+e.message)}
};
$("#sSync").onclick=()=>sync(true);

/* ---------------- partículas ---------------- */
(function(){let h="";for(let i=0;i<18;i++){h+=`<i style="left:${(Math.random()*100).toFixed(1)}%;top:${(18+Math.random()*80).toFixed(1)}%;--d:${(2.4+Math.random()*3.2).toFixed(2)}s;--dl:${(Math.random()*4).toFixed(2)}s;--o:${(.35+Math.random()*.55).toFixed(2)}"></i>`}$("#sparks").innerHTML=h})();

/* ---------------- arranque ---------------- */
render();renderBrief(true);
requestAnimationFrame(()=>{layout();apply(maxTy+home.clientHeight*.6);animateTo(maxTy,900)});
addEventListener("resize",()=>{cancelAnimationFrame(tween);layout()});
document.fonts&&document.fonts.ready.then(()=>{if(!drag)layout()});
setInterval(()=>{const n=new Date();n.setHours(0,0,0,0);if(n.getTime()!==today.getTime()){today=n;if(selDay<iso(today))selDay=iso(today)}renderBrief();renderPills()},30000);
if(!db.name){setTimeout(()=>{let n=null;try{n=prompt("¿Cómo te llamas?")}catch(e){}if(n){db.name=n.trim();render();renderBrief(true)}},900)}
setSync("ok");sync(true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
